name: NTUB 羽球每20分鐘

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ntub-badminton-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 讀取專案
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: 檢查北商羽球課
        id: monitor
        continue-on-error: true
        run: |
          python monitor.py | tee monitor_output.txt

      - name: 保存除錯資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntub-monitor-debug
          path: |
            monitor_output.txt
            site/debug.html
            site/debug.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 如果人數改變，保存新基準
        shell: bash
        run: |
          if grep -q "STATE_CHANGED=1" monitor_output.txt 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update badminton enrollment baseline"
              git push
            fi
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳手機版網頁
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 發布手機版網頁
        id: deployment
        uses: actions/deploy-pages@v4
